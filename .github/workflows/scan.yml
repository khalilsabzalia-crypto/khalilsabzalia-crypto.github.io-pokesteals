name: scan
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scan.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VINTED_FEED_URL: ${{ secrets.VINTED_FEED_URL }}
          VINTED_FEED_TOKEN: ${{ secrets.VINTED_FEED_TOKEN }}
          POKEMONTCG_KEY: ${{ secrets.POKEMONTCG_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          VINTED_DIRECT: ${{ secrets.VINTED_DIRECT }}
          VINTED_UA: ${{ secrets.VINTED_UA }}
